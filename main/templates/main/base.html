{% load static %}{% load livereload_tags %}<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% block meta %}{% include "main/meta.html" %}{% endblock %}
    <link rel="stylesheet" href="{% static 'dist/bundle.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Prompt:wght@400;500;700&display=swap"
    />
    {% livereload_script %}
  </head>

  <body class="flex min-h-svh flex-col bg-ink font-content text-base leading-relaxed text-fog-100">
    {% include 'main/navbar.html' %}
    <main class="flex-1">{% block body %}{% endblock %}</main>
    {% include 'main/footer.html' %}
    {% if env == "prod" %}
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-6FTQ6FD598"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag("js", new Date())

      gtag("config", "G-6FTQ6FD598")
    </script>
    {% endif %}
  </body>
</html>
