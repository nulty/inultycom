<header class="border-b border-ink-rule bg-ink-deep">
  <nav aria-label="Main" class="mx-auto flex h-16 max-w-page items-center justify-between gap-4 px-6">
    <a href="/" aria-label="inulty, home" class="flex min-h-11 items-center">
      {% include "main/logo.html" with class="h-7 w-auto fill-accent" %}
    </a>
    <div class="flex items-center gap-1">
      <a href="/blog" class="flex min-h-11 items-center px-3.5 text-[15px] font-medium text-fog-100 hover:text-white">Blog</a>
      {% for link in social_links %}
      <a href="{{ link.url }}" rel="noopener" aria-label="{{ link.label }}" class="flex h-11 w-11 items-center justify-center text-fog-400 hover:text-white">
        {% with icon="main/icons/"|add:link.icon|add:".html" %}{% include icon with class=link.size %}{% endwith %}
      </a>
      {% endfor %}
    </div>
  </nav>
</header>
