[tools]
python = "3.13"
uv = "0.13.9"
node = "24"
ruby = "3.4.5"
"gem:kamal" = "2.10.1"
doctl = "latest"

[settings]
disable_tools = ['yarn']
# mise creates ./.venv with uv from the python above (when uv.lock exists) and
# activates it, so `python` is the same interpreter in the shell, make, foreman and bin/.
python.uv_venv_auto = "create|source"
